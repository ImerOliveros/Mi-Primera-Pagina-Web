<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Tarjeta de presentacion</title>
  <link rel='stylesheet' href='main.css'>
</head>
  <body>
<header>
        <h1>Sistema de Tickets</h1>
    </header>

    <div class="container">

        <div class="acciones">
            <button>+ Nuevo Ticket</button>

            <input type="text" placeholder="Buscar ticket...">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Asunto</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>001</td>
                    <td>Juan Pérez</td>
                    <td>Error de acceso</td>
                    <td><span class="alta">Alta</span></td>
                    <td><span class="abierto">Abierto</span></td>
                </tr>

                <tr>
                    <td>002</td>
                    <td>María López</td>
                    <td>Problema con impresora</td>
                    <td><span class="media">Media</span></td>
                    <td><span class="proceso">En Proceso</span></td>
                </tr>

                <tr>
                    <td>003</td>
                    <td>Carlos Ruiz</td>
                    <td>Internet lento</td>
                    <td><span class="baja">Baja</span></td>
                    <td><span class="cerrado">Cerrado</span></td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
</html>
